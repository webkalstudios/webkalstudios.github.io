<!-- Adresse courte à partager : elle ouvre l'accueil à la bonne partie, sans « # » dans l'adresse. -->
<meta name="robots" content="noindex">
<link rel="canonical" href="https://webkal.net/">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" type="image/png" href="/images/favicon.png" sizes="96x96">
<link rel="apple-touch-icon" href="/images/apple-touch-icon.png">

<meta property="og:type" content="website">
<meta property="og:locale" content="fr_FR">

<noscript><meta http-equiv="refresh" content="0; url=/#deroule"></noscript>
<script>
  // L'accueil lit cette demande et descend à la partie voulue.
  try {
    sessionStorage.setItem("provenance", document.referrer);
    sessionStorage.setItem("partie", "deroule");
    location.replace("/");
  } catch (e) {
    location.replace("/#deroule");
  }
</script>
